<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leafy Roasters Inventory Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="/static/mongodb-logo.png" alt="MongoDB" class="brand-logo" />
          <div class="brand-text">
            <strong>Leafy Roasters</strong>
            <span>Inventory</span>
          </div>
        </div>

        <nav class="nav" aria-label="Primary">
          <button class="nav-item active" data-tab="dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /></svg>
            <span class="nav-label">Dashboard</span>
          </button>
          <button class="nav-item" data-tab="alerts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
            <span class="nav-label">Inbox</span>
            <span class="nav-badge hidden" id="alertBadge">0</span>
          </button>
          <button class="nav-item" data-tab="products">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><polyline points="3.27 6.96 12 12.01 20.73 6.96" /><line x1="12" y1="22.08" x2="12" y2="12" /></svg>
            <span class="nav-label">Products</span>
          </button>
          <button class="nav-item" data-tab="purchase_orders">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><rect x="8" y="2" width="8" height="4" rx="1" /></svg>
            <span class="nav-label">Purchase orders</span>
          </button>
          <button class="nav-item" data-tab="suppliers">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="3" width="15" height="13" rx="1" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>
            <span class="nav-label">Suppliers</span>
          </button>
        </nav>
      </aside>

      <div class="content">
        <header class="topbar">
          <div>
            <h1 id="pageTitle">Dashboard</h1>
          </div>

          <!-- Decorative only: this demo has no auth. Stands in for the shop owner the
               agent is talking to, so the dashboard reads as somebody's account. -->
          <span class="avatar">DW</span>
        </header>

        <main id="view" class="view"></main>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
